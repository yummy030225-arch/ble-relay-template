<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVAKOM BLE 中继控制</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f2f4f8; margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        #app { max-width: 700px; width: 100%; background: white; border-radius: 28px; padding: 20px 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
        h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 6px; color: #1a1a2e; display: flex; align-items: center; gap: 6px; }
        h1 small { font-size: 0.7rem; font-weight: 400; color: #6c757d; }
        .section { background: #f8f9fc; border-radius: 18px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid #e9ecf0; }
        .section-title { font-weight: 600; font-size: 0.9rem; color: #2c3e50; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
        .row label { font-size: 0.85rem; font-weight: 500; color: #34495e; min-width: 54px; }
        .row input[type="range"] { flex: 1; min-width: 100px; accent-color: #4a6cf7; height: 6px; }
        .row select { padding: 5px 8px; border-radius: 8px; border: 1px solid #ced4da; background: white; font-size: 0.8rem; min-width: 80px; }
        .value-display { min-width: 30px; text-align: center; font-weight: 600; font-size: 0.9rem; color: #1a1a2e; }
        .btn { padding: 6px 14px; border: none; border-radius: 10px; font-weight: 500; font-size: 0.8rem; cursor: pointer; transition: 0.15s; background: #e9ecef; color: #1a1a2e; touch-action: manipulation; }
        .btn:active { transform: scale(0.94); }
        .btn-primary { background: #4a6cf7; color: white; }
        .btn-primary:active { background: #3a5cd9; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:active { background: #218838; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:active { background: #c82333; }
        .btn-warning { background: #ffc107; color: #1a1a2e; }
        .btn-warning:active { background: #e0a800; }
        .btn-outline { background: transparent; border: 1px solid #ced4da; }
        .btn-outline:active { background: #f1f3f5; }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }

        .status-badge { display: inline-block; padding: 3px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; background: #e9ecef; color: #6c757d; }
        .status-badge.connected { background: #d4edda; color: #155724; }
        .status-badge.error { background: #f8d7da; color: #721c24; }

        #logArea { background: #1a1a2e; color: #d0d4e0; border-radius: 14px; padding: 10px 14px; font-family: 'Menlo', 'Consolas', monospace; font-size: 0.7rem; height: 160px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin-top: 6px; line-height: 1.6; }
        .log-time { color: #6c757d; margin-right: 6px; }
        .log-info { color: #8ab4f8; }
        .log-ok { color: #81c995; }
        .log-error { color: #f28b82; }
        .log-warn { color: #fdd663; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .gap-1 { gap: 6px; }
        .mt-1 { margin-top: 8px; }

        audio { display: none; }

        @media (max-width: 480px) {
            #app { padding: 14px; }
            .row { flex-direction: column; align-items: stretch; }
            .row label { min-width: auto; }
            .row .btn { align-self: flex-start; }
        }
    </style>
</head>
<body>
<div id="app">
    <h1>⚡ SVAKOM 中继 <small>BLE + MCP</small></h1>

    <!-- 服务器配置 -->
    <div class="section">
        <div class="section-title">🌐 MCP 服务器</div>
        <div class="row">
            <input type="text" id="serverUrl" placeholder="https://你的服务地址" value="https://ble-relay-template-production-ca83.up.railway.app" style="flex:1; padding:8px 12px; border-radius:10px; border:1px solid #ced4da; font-size:0.9rem;">
            <button class="btn btn-primary" id="btnConnectServer">连接</button>
            <button class="btn btn-outline" id="btnDisconnectServer">断开</button>
        </div>
        <div class="row" style="margin-bottom:0;">
            <span class="status-badge" id="serverStatus">未连接</span>
            <span style="font-size:0.7rem; color:#6c757d;" id="serverUrlDisplay"></span>
        </div>
    </div>

    <!-- 蓝牙控制 -->
    <div class="section">
        <div class="section-title">📡 蓝牙设备</div>
        <div class="row">
            <button class="btn btn-success" id="btnConnectBLE">连接蓝牙</button>
            <button class="btn btn-danger" id="btnDisconnectBLE">断开</button>
            <span class="status-badge" id="bleStatus">未连接</span>
            <span style="font-size:0.8rem; color:#6c757d;" id="deviceName"></span>
        </div>
        <div class="row" style="margin-bottom:0;">
            <button class="btn btn-warning" id="btnTest">🧪 测试（震动模式3 强度80）</button>
            <button class="btn btn-danger" id="btnStopAll">⏹ 全部停止</button>
        </div>
    </div>

    <!-- 功能控制 -->
    <div class="section">
        <div class="section-title">🎮 功能控制</div>

        <!-- 震动 -->
        <div class="row">
            <label>震动</label>
            <select id="vibMode">
                <option value="1">1 持续慢</option><option value="2">2 持续中</option><option value="3">3 持续快</option>
                <option value="4">4 渐变循环</option><option value="5">5 长震渐强</option><option value="6">6 3短1长</option>
                <option value="7">7 变频短震</option><option value="8">8 连续短震</option><option value="9">9 更快短震</option>
                <option value="10">10 更更快短震</option>
            </select>
            <input type="range" id="vibLevel" min="0" max="100" value="50">
            <span class="value-display" id="vibLevelDisplay">50</span>
            <button class="btn btn-primary btn-sm" id="btnSendVib">发送</button>
        </div>

        <!-- 吮吸 -->
        <div class="row">
            <label>吮吸</label>
            <select id="sucMode">
                <option value="1">1 持续吮吸</option><option value="2">2 1长2短</option>
                <option value="3">3 间歇长吸</option><option value="4">4 持续短吸</option>
                <option value="5">5 12短1长</option>
            </select>
            <input type="range" id="sucLevel" min="0" max="100" value="50">
            <span class="value-display" id="sucLevelDisplay">50</span>
            <button class="btn btn-primary btn-sm" id="btnSendSuc">发送</button>
        </div>

        <!-- 加热 -->
        <div class="row">
            <label>加热</label>
            <button class="btn btn-sm" id="btnHeatOn" style="background:#ff6b6b; color:white;">开</button>
            <button class="btn btn-sm btn-outline" id="btnHeatOff">关</button>
            <span style="font-size:0.9rem; color:#2c3e50;" id="heatStatus">关闭</span>
        </div>

        <!-- 伸缩转珠 -->
        <div class="row">
            <label>伸缩转珠</label>
            <select id="rotMode">
                <option value="0">0 停止</option><option value="1">1 持续+转珠</option>
                <option value="2">2 更快+转珠</option><option value="3">3 持续+间歇转珠</option>
                <option value="4">4 渐快循环</option><option value="5">5 间隔伸缩+转珠</option>
                <option value="6">6 更快间隔</option><option value="7">7 连伸两次+缩+转珠</option>
            </select>
            <button class="btn btn-primary btn-sm" id="btnSendRot">发送</button>
        </div>
    </div>

    <!-- 日志 -->
    <div class="section" style="margin-bottom:0;">
        <div class="flex-between">
            <div class="section-title" style="margin-bottom:0;">📋 日志</div>
            <button class="btn btn-outline btn-sm" id="btnClearLog">清空</button>
        </div>
        <div id="logArea"></div>
    </div>

    <!-- 无声音频保活 -->
    <audio id="keepaliveAudio" loop crossorigin="anonymous">
        <source src="https://img.baibai.cv/f/dZymTQ/30min-osbvow%202.mp4" type="audio/mpeg">
    </audio>
</div>

<script>
    // ========== 常量 ==========
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    // ========== DOM 引用 ==========
    const $ = id => document.getElementById(id);
    const serverUrl = $('serverUrl');
    const btnConnectServer = $('btnConnectServer');
    const btnDisconnectServer = $('btnDisconnectServer');
    const serverStatus = $('serverStatus');
    const serverUrlDisplay = $('serverUrlDisplay');
    const btnConnectBLE = $('btnConnectBLE');
    const btnDisconnectBLE = $('btnDisconnectBLE');
    const bleStatus = $('bleStatus');
    const deviceName = $('deviceName');

    const vibMode = $('vibMode');
    const vibLevel = $('vibLevel');
    const vibLevelDisplay = $('vibLevelDisplay');
    const btnSendVib = $('btnSendVib');

    const sucMode = $('sucMode');
    const sucLevel = $('sucLevel');
    const sucLevelDisplay = $('sucLevelDisplay');
    const btnSendSuc = $('btnSendSuc');

    const btnHeatOn = $('btnHeatOn');
    const btnHeatOff = $('btnHeatOff');
    const heatStatus = $('heatStatus');

    const rotMode = $('rotMode');
    const btnSendRot = $('btnSendRot');

    const btnTest = $('btnTest');
    const btnStopAll = $('btnStopAll');
    const logArea = $('logArea');
    const btnClearLog = $('btnClearLog');
    const audioEl = $('keepaliveAudio');

    // ========== 状态 ==========
    let isServerConnected = false;
    let isBLEConnected = false;
    let characteristic = null;
    let pollTimer = null;
    let keepAliveTimer = null;
    let bleDevice = null;   // 保存设备对象以便断开

    // 当前活跃状态（用于续命）
    const currentState = {
        vibration: { mode: 1, level: 0 },
        suction: { mode: 1, level: 0 },
        heat: false,
        rotate: 0   // 0=停止
    };

    // ========== 日志 ==========
    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        const cls = `log-${type}`;
        entry.innerHTML = `<span class="log-time">[${time}]</span><span class="${cls}">${msg}</span>`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        while (logArea.children.length > 200) logArea.removeChild(logArea.firstChild);
    }

    function updateServerStatus(text, cls = '') {
        serverStatus.textContent = text;
        serverStatus.className = 'status-badge' + (cls ? ' ' + cls : '');
        serverUrlDisplay.textContent = cls ? serverUrl.value.trim() : '';
    }

    function updateBLEStatus(text, cls = '') {
        bleStatus.textContent = text;
        bleStatus.className = 'status-badge' + (cls ? ' ' + cls : '');
    }

    // ========== 命令生成（按实测协议） ==========
    function mapLevel(percent) {
        // 0~100 -> 0~10 (0x00~0x0A)
        return Math.min(10, Math.max(0, Math.round(percent / 10)));
    }

    function cmdVibration(mode, levelPercent) {
        const hw = mapLevel(levelPercent);
        return new Uint8Array([0x55, 0x03, 0x00, 0x00, Math.min(10, Math.max(1, mode)), hw, 0x00]);
    }

    function cmdSuction(mode, levelPercent) {
        const hw = mapLevel(levelPercent);
        return new Uint8Array([0x55, 0x09, 0x00, 0x00, Math.min(5, Math.max(1, mode)), hw, 0x00]);
    }

    function cmdHeat(on) {
        // 开启: 55 05 01 37 00 00 00 ; 关闭: 55 05 00 00 00 00 00 (实测)
        if (on) {
            return new Uint8Array([0x55, 0x05, 0x01, 0x37, 0x00, 0x00, 0x00]);
        } else {
            return new Uint8Array([0x55, 0x05, 0x00, 0x00, 0x00, 0x00, 0x00]);
        }
    }

    function cmdRotate(mode) {
        // mode 0~7, 0停止
        return new Uint8Array([0x55, 0x08, 0x00, 0x00, Math.min(7, Math.max(0, mode)), 0x00, 0x00]);
    }

    // ========== 蓝牙写入 ==========
    async function writeCommand(dataArray) {
        if (!characteristic) {
            log('❌ 蓝牙未连接或特征无效', 'error');
            return false;
        }
        try {
            await characteristic.writeValue(dataArray);
            const hex = Array.from(dataArray).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
            log(`📤 发送: ${hex}`, 'ok');
            return true;
        } catch (e) {
            log(`❌ 写入失败: ${e.message}`, 'error');
            return false;
        }
    }

    // ========== 发送各功能（同时更新状态） ==========
    async function sendVibration(mode, level) {
        currentState.vibration = { mode, level };
        return await writeCommand(cmdVibration(mode, level));
    }

    async function sendSuction(mode, level) {
        currentState.suction = { mode, level };
        return await writeCommand(cmdSuction(mode, level));
    }

    async function sendHeat(on) {
        currentState.heat = on;
        heatStatus.textContent = on ? '开启' : '关闭';
        return await writeCommand(cmdHeat(on));
    }

    async function sendRotate(mode) {
        currentState.rotate = mode;
        return await writeCommand(cmdRotate(mode));
    }

    // ========== 停止所有 ==========
    async function stopAll() {
        log('⏹ 停止所有功能', 'warn');
        currentState.vibration.level = 0;
        currentState.suction.level = 0;
        currentState.heat = false;
        currentState.rotate = 0;
        heatStatus.textContent = '关闭';
        await writeCommand(cmdVibration(1, 0));
        await writeCommand(cmdSuction(1, 0));
        await writeCommand(cmdHeat(false));
        await writeCommand(cmdRotate(0));
        log('✅ 全部停止', 'ok');
    }

    // ========== 续命 ==========
    async function keepAlive() {
        if (!isBLEConnected || !characteristic) return;
        try {
            const { vibration, suction, heat, rotate } = currentState;
            if (vibration.level > 0) await writeCommand(cmdVibration(vibration.mode, vibration.level));
            if (suction.level > 0) await writeCommand(cmdSuction(suction.mode, suction.level));
            if (heat) await writeCommand(cmdHeat(true));
            if (rotate > 0) await writeCommand(cmdRotate(rotate));
        } catch (e) {
            log(`续命错误: ${e.message}`, 'error');
        }
    }

    // ========== 轮询 MCP 服务器 ==========
    async function pollServer() {
        if (!isServerConnected) return;
        try {
            const url = serverUrl.value.trim() + '/toy-next';
            const resp = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
            if (!resp.ok) {
                log(`⚠️ 服务器响应 ${resp.status}`, 'warn');
                return;
            }
            const data = await resp.json();
            const cmd = data.command;
            if (!cmd) return; // 静默跳过

            log(`📨 收到指令: ${cmd.action} ${JSON.stringify(cmd.args || {})}`, 'info');
            const args = cmd.args || {};
            switch (cmd.action) {
                case 'vibrate': {
                    const mode = args.mode || 1;
                    const level = args.level !== undefined ? args.level : 0;
                    await sendVibration(mode, level);
                    vibMode.value = mode;
                    vibLevel.value = level;
                    vibLevelDisplay.textContent = level;
                    break;
                }
                case 'suction': {
                    const mode = args.mode || 1;
                    const level = args.level !== undefined ? args.level : 0;
                    await sendSuction(mode, level);
                    sucMode.value = mode;
                    sucLevel.value = level;
                    sucLevelDisplay.textContent = level;
                    break;
                }
                case 'heat': {
                    const on = args.on === true;
                    await sendHeat(on);
                    heatStatus.textContent = on ? '开启' : '关闭';
                    break;
                }
                case 'rotate': {
                    const mode = args.mode || 0;
                    await sendRotate(mode);
                    rotMode.value = mode;
                    break;
                }
                case 'stop_rotate': {
                    await sendRotate(0);
                    rotMode.value = 0;
                    break;
                }
                case 'stop_all': {
                    await stopAll();
                    vibLevel.value = 0; vibLevelDisplay.textContent = '0';
                    sucLevel.value = 0; sucLevelDisplay.textContent = '0';
                    rotMode.value = 0;
                    heatStatus.textContent = '关闭';
                    break;
                }
                default:
                    log(`⚠️ 未知 action: ${cmd.action}`, 'warn');
            }
        } catch (e) {
            log(`❌ 轮询错误: ${e.message}`, 'error');
        }
    }

    // ========== 启动/停止轮询和续命 ==========
    function startPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(pollServer, 300);
        log('🔄 轮询启动 (300ms)', 'info');
    }
    function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; log('⏹ 轮询停止', 'info'); }
    }
    function startKeepAlive() {
        if (keepAliveTimer) clearInterval(keepAliveTimer);
        keepAliveTimer = setInterval(keepAlive, 1500);
        log('💓 续命启动 (1.5s)', 'info');
    }
    function stopKeepAlive() {
        if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; log('💔 续命停止', 'info'); }
    }

    // ========== 服务器连接 ==========
    async function connectServer() {
        const url = serverUrl.value.trim();
        if (!url) { log('⚠️ 请输入服务器地址', 'warn'); return; }
        try {
            const resp = await fetch(url + '/', { method: 'GET' });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            isServerConnected = true;
            updateServerStatus('已连接', 'connected');
            log('✅ MCP 服务器连接成功', 'ok');
            startPolling();
            startKeepAlive();
        } catch (e) {
            log(`❌ 服务器连接失败: ${e.message}`, 'error');
            updateServerStatus('连接失败', 'error');
            isServerConnected = false;
        }
    }

    function disconnectServer() {
        isServerConnected = false;
        stopPolling();
        stopKeepAlive();
        updateServerStatus('已断开');
        log('🔌 服务器已断开', 'info');
    }

    // ========== 蓝牙连接 ==========
    async function connectBLE() {
        if (isBLEConnected) { log('ℹ️ 蓝牙已连接', 'info'); return; }
        try {
            log('🔍 请求蓝牙设备...', 'info');
            // 使用 acceptAllDevices 提高兼容性
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });
            bleDevice = device;
            log(`✅ 选择设备: ${device.name || device.id}`, 'ok');
            deviceName.textContent = device.name || device.id;

            const server = await device.gatt.connect();
            log('🔗 已连接 GATT', 'ok');

            const service = await server.getPrimaryService(SERVICE_UUID);
            log('📡 已获取服务', 'ok');

            characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
            log('📡 已获取特征', 'ok');

            isBLEConnected = true;
            updateBLEStatus('已连接', 'connected');

            // 播放音频保活
            try { await audioEl.play(); log('🔊 无声音频保活启动', 'info'); } catch (e) { log('⚠️ 音频保活启动失败', 'warn'); }
        } catch (e) {
            log(`❌ 蓝牙连接失败: ${e.message}`, 'error');
            updateBLEStatus('连接失败', 'error');
            characteristic = null;
            isBLEConnected = false;
            bleDevice = null;
        }
    }

    function disconnectBLE() {
        if (bleDevice && bleDevice.gatt) {
            try { bleDevice.gatt.disconnect(); } catch (e) {}
        }
        characteristic = null;
        isBLEConnected = false;
        bleDevice = null;
        updateBLEStatus('已断开');
        deviceName.textContent = '';
        log('🔌 蓝牙已断开', 'info');
        // 停止音频
        try { audioEl.pause(); } catch (e) {}
    }

    // ========== UI 事件绑定 ==========
    btnConnectServer.addEventListener('click', connectServer);
    btnDisconnectServer.addEventListener('click', disconnectServer);

    btnConnectBLE.addEventListener('click', connectBLE);
    btnDisconnectBLE.addEventListener('click', disconnectBLE);

    btnSendVib.addEventListener('click', () => {
        const mode = parseInt(vibMode.value);
        const level = parseInt(vibLevel.value);
        sendVibration(mode, level);
    });
    vibLevel.addEventListener('input', () => {
        vibLevelDisplay.textContent = vibLevel.value;
    });

    btnSendSuc.addEventListener('click', () => {
        const mode = parseInt(sucMode.value);
        const level = parseInt(sucLevel.value);
        sendSuction(mode, level);
    });
    sucLevel.addEventListener('input', () => {
        sucLevelDisplay.textContent = sucLevel.value;
    });

    btnHeatOn.addEventListener('click', () => sendHeat(true));
    btnHeatOff.addEventListener('click', () => sendHeat(false));

    btnSendRot.addEventListener('click', () => {
        const mode = parseInt(rotMode.value);
        sendRotate(mode);
    });

    btnTest.addEventListener('click', () => {
        log('🧪 测试: 震动模式3 强度80', 'info');
        sendVibration(3, 80);
        vibMode.value = 3;
        vibLevel.value = 80;
        vibLevelDisplay.textContent = '80';
    });

    btnStopAll.addEventListener('click', stopAll);
    btnClearLog.addEventListener('click', () => { logArea.innerHTML = ''; });

    // ========== 初始化 ==========
    updateServerStatus('未连接');
    updateBLEStatus('未连接');
    log('🚀 页面加载完成，请连接服务器和蓝牙', 'info');

    // 点击任意处尝试播放音频（iOS 要求）
    document.addEventListener('click', () => {
        if (audioEl.paused) audioEl.play().catch(() => {});
    }, { once: true });

    // 如果连接断开，重置状态
    window.addEventListener('beforeunload', () => {
        if (bleDevice && bleDevice.gatt) {
            try { bleDevice.gatt.disconnect(); } catch (e) {}
        }
    });
</script>
</body>
</html>
